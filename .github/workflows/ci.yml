name: Lint HTML CSS JS

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm init -y
          npm install eslint@8 stylelint stylelint-config-standard htmlhint --save-dev

      - name: Lint JavaScript
        run: npx eslint .

      - name: Lint CSS
        run: npx stylelint "**/*.css"

      - name: Lint HTML
        run: npx htmlhint "**/*.html"